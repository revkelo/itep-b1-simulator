<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="iTEP Practice Simulator">
  <title>iTEP Practice Simulator</title>
  <defs>
    <linearGradient id="iTepRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eb0ec"/>
      <stop offset="1" stop-color="#1a4a78"/>
    </linearGradient>
  </defs>

  <!-- El disco y el arco: el arco es el tiempo, que es de lo que trata el
       examen. Arranca arriba y recorre tres cuartos, no el circulo completo,
       porque un cronometro lleno no dice nada. -->
  <circle cx="60" cy="60" r="54" fill="#0f172a"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#1e3a5f" stroke-width="6"/>
  <path d="M60 14 A46 46 0 1 1 14 60" fill="none" stroke="url(#iTepRing)"
        stroke-width="6" stroke-linecap="round"/>

  <text x="60" y="72" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
        letter-spacing="-1" fill="#ffffff">iTEP</text>
</svg>
